<!doctype html>
<html lang="en">

<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-15QSS7T6SH"></script>
  <script>
    window.dataLayer = window.dataLayer || []
    function gtag() {
      dataLayer.push(arguments)
    }
    gtag('js', new Date())

    gtag('config', 'G-15QSS7T6SH')
  </script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>汉斯 Naive UI 扩展版本</title>
  <meta name="naive-ui-style" />
  <meta name="vueuc-style" />
  <link rel="icon" type="image/svg+xml" href="/demo/assets/images/naivelogo.svg" />
</head>

<body>
  <script>
    const base = '/naive-ui/'                     // 与 SITE_BASE 保持一致
    const path = window.location.pathname.replace(base, '/')
    const pathLocale = path.startsWith('/en-US')
      ? 'en-US'
      : path.startsWith('/zh-CN')
        ? 'zh-CN'
        : undefined
    function deriveTitleFromLocale(locale = navigator.language) {
      if (locale === 'zh-CN') {
        document.title = '汉斯 Naive UI 扩展版本'
      } else {
        document.title = 'Naive UI: A Vue 3 Component Library'
      }
    }
    deriveTitleFromLocale(pathLocale)
  </script>
  <div id="app"></div>
  <script type="module" src="__INDEX__"></script>
</body>

</html>
